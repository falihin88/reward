services:
  # 1. AMYN Madrasah Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    expose:
      - "8000"
    labels:
      - "coolify.managed=true"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
    environment:
      APP_NAME: "${APP_NAME:-AMYN Madrasah}"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-"false"}
      APP_URL: ${APP_URL:-"http://localhost:8000"}
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-amyn_madrasah}
      DB_USERNAME: ${DB_USERNAME:-amyn_user}
      DB_PASSWORD: ${DB_PASSWORD:-amyn_secret_password}
      PHP_CLI_SERVER_WORKERS: ${PHP_CLI_SERVER_WORKERS:-4}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-public}
      SEED_ON_DEPLOY: ${SEED_ON_DEPLOY:-false}
    volumes:
      - storage_data:/var/www/html/storage
      - uploads_data:/var/www/html/public/uploads
    networks:
      - backend-network
      - frontend-network
    depends_on:
      mariadb:
        condition: service_healthy

  # 2. MariaDB Database Server
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    command: --skip-name-resolve --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret_password}
      MYSQL_DATABASE: ${DB_DATABASE:-amyn_madrasah}
      MYSQL_USER: ${DB_USERNAME:-amyn_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-amyn_secret_password}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 3. phpMyAdmin Database GUI
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8080}:80"
    expose:
      - "80"
    labels:
      - "coolify.managed=true"
      - "traefik.http.services.phpmyadmin.loadbalancer.server.port=80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 64M
    networks:
      - backend-network
      - frontend-network
    depends_on:
      mariadb:
        condition: service_healthy

networks:
  backend-network:
    internal: true
  frontend-network:

volumes:
  mariadb_data:
  storage_data:
  uploads_data:

