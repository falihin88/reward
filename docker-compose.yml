# AMYN Madrasah — Laravel 13 (app + bundled MariaDB)
#
# Coolify notes:
#   - Do NOT define custom `networks:` here. Coolify manages the Traefik proxy
#     network and auto-generates HTTPS/domain routing. The `app` and `mariadb`
#     services talk to each other over the default compose network via service name.
#   - Set the `app` service "Domains" field to `https://your-domain:8000`.
#     The `:8000` only tells the proxy the container port; visitors still use 443.
#   - Set APP_KEY in Coolify (a fixed `base64:...` value) so sessions survive
#     redeploys. The entrypoint only auto-generates one when APP_KEY is empty.
#   - Override DB_PASSWORD / MYSQL_ROOT_PASSWORD in Coolify for production.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/up || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    environment:
      APP_NAME: "${APP_NAME:-AMYN Madrasah}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:-}"
      APP_URL: "${APP_URL:-http://localhost}"

      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-amyn_madrasah}"
      DB_USERNAME: "${DB_USERNAME:-amyn_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      SEED_ON_DEPLOY: "${SEED_ON_DEPLOY:-false}"

    volumes:
      - storage_data:/var/www/html/storage
      - uploads_data:/var/www/html/public/uploads
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    command: --skip-name-resolve --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_secret}"
      MYSQL_DATABASE: "${DB_DATABASE:-amyn_madrasah}"
      MYSQL_USER: "${DB_USERNAME:-amyn_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  storage_data:
  uploads_data:
  mariadb_data:
