services:
  # 1. AMYN Madrasah Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amyn_madrasah_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "AMYN Madrasah"
      APP_ENV: production
      APP_KEY: "base64:7qZ0bY1V4mK9WpX3rL8sN2tU5vY6zA1bC2dE3fG4hI5="
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: amyn_madrasah
      DB_USERNAME: amyn_user
      DB_PASSWORD: amyn_secret_password
    volumes:
      - storage_data:/var/www/html/storage
      - uploads_data:/var/www/html/public/uploads
    depends_on:
      mariadb:
        condition: service_healthy

  # 2. MariaDB Database Server
  mariadb:
    image: mariadb:11
    container_name: amyn_madrasah_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: amyn_madrasah
      MYSQL_USER: amyn_user
      MYSQL_PASSWORD: amyn_secret_password
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. phpMyAdmin Database Management Interface
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: amyn_madrasah_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_secret_password
    depends_on:
      - mariadb

volumes:
  mariadb_data:
  storage_data:
  uploads_data:
